spring:
  datasource:
    url: jdbc:postgresql://snippet_manager_db:5432/snippet-manager-db
    username: ${SPRING_DATASOURCE_USERNAME_SNIPPET_MANAGER}
    password: ${SPRING_DATASOURCE_PASSWORD_SNIPPET_MANAGER}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  auth0:
    client-id: ${AUTH0_CLIENT_ID}
    client-secret: ${AUTH0_CLIENT_SECRET}
    domain: ${AUTH0_DOMAIN}
    audience: ${AUTH0_AUDIENCE}
